[project]
name = "searchengine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tisha7353", email = "tgtishagarg@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "arxiv>=4.0.1",
    "ddgs>=9.16.0",
    "duckduckgo-search>=8.1.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
searchengine = "searchengine:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
